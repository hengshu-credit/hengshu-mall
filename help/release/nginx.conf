map $http_x_forwarded_proto $external_scheme {
    default $scheme;
    https https;
}
map $external_scheme $external_https {
    default off;
    https on;
}
map $external_scheme $external_port {
    default 80;
    https 443;
}

server {
    listen 80;
    server_name mall.hengshucredit.com;
    absolute_redirect off;
    root /var/www/public;
    index index.php index.html;
    client_max_body_size 100M;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = / { return 302 /admin/; }
    location = /admin { return 301 /admin/; }
    location = /admin/index.html {
        if (!-f /var/www/public/install.lock) { return 302 /install/index.php; }
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location ^~ /admin/system_static/ {
        try_files $uri =404;
        expires 30d;
    }
    location ^~ /admin/ {
        if (!-f /var/www/public/install.lock) { return 302 /install/index.php; }
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        if (!-e $request_filename) {
            rewrite ^(.*)$ /index.php?s=$1 last;
        }
    }
    location ~ /\. { return 404; }
    location ~* \.(sql|log|bak|ini|env)$ { return 404; }
    location ~* ^/(uploads|theme)/.*\.(php|phtml|phar)$ { return 404; }

    location /notice {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $notice_backend phpfpm:40001;
        rewrite ^/notice/?(.*)$ /$1 break;
        proxy_pass http://$notice_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $external_scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }
    location /msg {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $chat_backend phpfpm:40002;
        rewrite ^/msg/?(.*)$ /$1 break;
        proxy_pass http://$chat_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $external_scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    location = /install/index.php {
        if (-f /var/www/public/install.lock) { return 404; }
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $external_https;
        fastcgi_param REQUEST_SCHEME $external_scheme;
        fastcgi_param SERVER_PORT $external_port;
        fastcgi_read_timeout 180s;
        fastcgi_pass phpfpm:9000;
    }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $external_https;
        fastcgi_param REQUEST_SCHEME $external_scheme;
        fastcgi_param SERVER_PORT $external_port;
        fastcgi_read_timeout 180s;
        fastcgi_pass phpfpm:9000;
    }
    location ~ \.php$ { return 404; }
}
