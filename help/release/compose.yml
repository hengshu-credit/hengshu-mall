name: crmeb-mall

x-php: &php
  image: ccr.ccs.tencentyun.com/crmebky_php/php:v7.4
  working_dir: /var/www
  restart: unless-stopped
  labels:
    com.hengshu.release: '__RELEASE_ID__'
  volumes:
    - ./crmeb:/var/www
    - ./deploy:/deploy:ro
    - ./deploy/php.ini:/usr/local/etc/php/conf.d/zz-release.ini:ro

services:
  mysql:
    image: ccr.ccs.tencentyun.com/crmebky_php/mysql:v8.0.45
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: crmeb
      MYSQL_USER: crmeb
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysqladmin ping -h 127.0.0.1 --silent']
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes', --requirepass, '${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}']
    volumes:
      - ./data/redis:/data

  phpfpm:
    <<: *php
    entrypoint: [sh, /deploy/php-entrypoint.sh]
    command: [php-fpm]
    environment:
      TZ: Asia/Shanghai
      APP_DEBUG: 'false'
      MYSQL_HOST_IP: mysql
      MYSQL_PORT: '3306'
      MYSQL_USER: crmeb
      MYSQL_DATABASE: crmeb
      REDIS_HOST_IP: redis
      REDIS_PORT: '6379'
      REDIS_DATABASE: '0'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: ccr.ccs.tencentyun.com/crmebky_php/nginx:v1.29.6
    restart: unless-stopped
    labels:
      com.hengshu.release: '__RELEASE_ID__'
    ports:
      - '${BIND_IP:-0.0.0.0}:${HTTP_PORT:-8011}:80'
    volumes:
      - ./crmeb/public:/var/www/public:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - phpfpm
    networks:
      default:
        aliases: [mall-web]

  queue:
    <<: *php
    network_mode: service:phpfpm
    pid: service:phpfpm
    user: '33:33'
    entrypoint: [sh, /deploy/worker-entrypoint.sh]
    command: [php, think, 'queue:listen']
    stop_grace_period: 60s
    depends_on: [phpfpm]

  timer:
    <<: *php
    network_mode: service:phpfpm
    pid: service:phpfpm
    user: '33:33'
    entrypoint: [sh, /deploy/worker-entrypoint.sh]
    command: [php, think, timer, start]
    depends_on: [phpfpm]

  workerman:
    <<: *php
    network_mode: service:phpfpm
    pid: service:phpfpm
    user: '33:33'
    entrypoint: [sh, /deploy/worker-entrypoint.sh]
    command: [php, think, workerman, start]
    depends_on: [phpfpm]

  jd-crawler:
    build:
      context: ./jd-crawler
      args:
        PYTHON_IMAGE: ${JD_PYTHON_IMAGE:-python:3.12-slim-bookworm}
        DEBIAN_MIRROR: ${JD_DEBIAN_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/debian}
        DEBIAN_SECURITY_MIRROR: ${JD_DEBIAN_SECURITY_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/debian-security}
        PIP_INDEX_URL: ${JD_PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    image: hengshu-jd-crawler:local
    restart: unless-stopped
    shm_size: 1gb
    environment:
      TZ: Asia/Shanghai
      JD_CRAWLER_TOKEN: ${JD_CRAWLER_TOKEN:-}
      JD_VNC_PASSWORD: ${JD_VNC_PASSWORD:-}
      JD_CRAWLER_HOST: 0.0.0.0
      JD_CRAWLER_PORT: 8091
      JD_CRAWLER_DATA_DIR: /data
      JD_CRAWLER_JOB_TIMEOUT: ${JD_CRAWLER_JOB_TIMEOUT:-240}
      JD_CRAWLER_RETENTION_HOURS: 24
      JD_BROWSER_ADDRESS: 127.0.0.1:9222
      JD_LOGIN_PORT: ${JD_LOGIN_PORT:-6080}
    volumes:
      - jd-crawler-data:/data
    ports:
      - '127.0.0.1:${JD_LOGIN_PORT:-6080}:6080'

volumes:
  jd-crawler-data:
