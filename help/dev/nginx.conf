# Development pages are served from Windows source development servers.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name localhost;
    root /var/www/public;
    index index.php index.html;
    client_max_body_size 100M;
    absolute_redirect off;

    location = /admin { return 302 /admin/; }
    location ^~ /admin/ {
        proxy_pass http://host.docker.internal:1617;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
    location ~ /\. { deny all; }
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass phpfpm:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
    location ~ ^/(adminapi|api|kefuapi|outapi|surl)(/|$) {
        rewrite ^(.*)$ /index.php?s=$1 last;
    }
    location ~ ^/(kefu|app)(/|$) {
        proxy_pass http://host.docker.internal:1617;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
    location ~ ^/(uploads|statics|assets|install|upgrade)(/|$) {
        try_files $uri $uri/ =404;
    }
    location = /product_migration.xlsx { try_files $uri =404; }
    location = /service_pay_result.html { try_files $uri =404; }
    location /notice {
        proxy_pass http://phpfpm:40001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
    location /msg {
        proxy_pass http://phpfpm:40002/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
    location / {
        proxy_pass http://host.docker.internal:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
